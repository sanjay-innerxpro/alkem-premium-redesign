<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071526" />
    <title>You're offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #071526;
        color: #e8f1f5;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      img {
        width: 72px;
        height: 72px;
        margin: 0 auto 28px;
        display: block;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 600;
      }
      p {
        margin: 0 0 28px;
        line-height: 1.6;
        color: #9fb3c4;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 14px 30px;
        color: #071526;
        background: linear-gradient(115deg, #7fe0d2 0%, #a9d6f0 100%);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon/icon?size=192" alt="" />
      <h1>You're offline</h1>
      <p>
        Check your internet connection, then try again to continue browsing.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
