org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# ---- App settings: edit these ----
# Name under the launcher icon. Keep it in step with the website's Brand name, then run
# `npm run android:icons` so the launcher icon, splash and store graphics match too.
twa.appName=NexPharm
# Public HTTPS domain the app opens (no https://, no trailing slash). Must serve
# /.well-known/assetlinks.json for this app, see README.md.
twa.host=nexpharm.smartsoch.store
# Permanent Play Store ID. Cannot be changed after the first upload, even if the name
# changes later, so choose the final one before uploading.
twa.applicationId=com.nexpharm.healthcare
# Increase versionCode by 1 for every Play Store upload.
twa.versionCode=1
twa.versionName=1.0.0
